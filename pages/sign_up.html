<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Créez votre profil et sauvegardez vos préférences !">
    <meta name="robots" content="index, nofollow">
    <title>Ma Boutique - Créez votre profil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
    <!-- Titre principale -->
    <h1>Ma boutique - Accueil</h1>

    <div class="menu_nav">
        <nav>
            <a href="../index.html">Accueil</a>
            <a href="about.html">À propos</a>
            <a href="products.html">Produits</a>
            <a href="products_details.html">Détails produits</a>
            <a href="sign_up.html">Inscription</a>
            <a href="login.html">Connexion</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html">Panier</a>
        </nav>
    </div>

    </header>

    <main>
        <form action="" method="">
            <h2>Inscrivez-vous :</h2>
            <fieldset class="connexion">
                <legend>Informations de connexion</legend>
                <div class="last_name">
                    <label for="nom">Votre nom : </label>
                    <input type="text" id="nom" placeholder="Votre nom" required>
                </div>

                <div>
                    <label for="prenom">Votre prénom : </label>
                    <input type="text" id="prenom" placeholder="Votre prénom" required>
                </div>

                <div>
                    <label for="email">Votre adresse mail : </label>
                    <input type="email" id="email" placeholder="Votre adresse mail" required>
                </div>

                <div>
                    <label for="mdp">Votre mot de passe : </label>
                    <input type="password" id="mdp" placeholder="Votre mot de passe" required>
                </div>
            </fieldset>

            <fieldset class="optin">
                <legend>Informations complémentaires</legend>

                <div>
                    <label>Acceptez-vous de recevoir les offres du site ? <br>(s'il vous plaîîît ???)</label>
                    <input type="radio" id="oui" name="opt-in" value="oui">
                    <label for="oui">Oui</label>
                    <input type="radio" id="non" name="opt-in" value="non">
                    <label for="non">Non</label><br>
                </div>

                <div>
                    <label>Intérêts : </label>
                    <input type="checkbox" name="interests" id="desktop" value="desktop">
                    <label for="desktop">Desktop</label>
                    <input type="checkbox" name="interests" id="laptop" value="laptop">
                    <label for="laptop">Laptop</label>
                    <input type="checkbox" name="interests" id="componants" value="componants">
                    <label for="componants">Composantes</label><br>
                </div>

                <label for="pays">Pays : </label>
                <select name="pays" id="pays">
                    <option value="Angleterre">Angleterre</option>
                    <option value="France">France</option>
                    <option value="Espagne">Espagne</option>
                    <option value="Italie">Italie</option>
                    <option value="Tunisie">Tunisie</option>
                </select><br>
            </fieldset>

            <div class="account_boutons_form">
                <button type="submit">Envoyer</button>
                <button type="reset">Réinitialiser</button>
            </div>
        </form>

    </main>

    <footer>
        <h2>"Ma Boutique" est un nom de domaine déposé. Tous droits réservés.</h2>
        <div class="reseaux">
            <p>Suivez nous sur : </p>
            <a href="https://www.facebook.com" target="_blank" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://www.instagram.com" target="_blank" aria-label="Instagram"><i class="fa-brands fa-square-instagram"></i></a>
            <a href="https://www.tiktok.com/fr/" target="_blank" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
                <!-- href="mailto:xxx@xx.com" permet d'ouvrir une appli de messagerie pour envoyer un mail au destinataire désigné -->
            <a href="mailto:kevin.sch.18@gmail.com" aria-label="Envoyez un mail"><i class="fa-solid fa-envelope"></i></a>
            <!-- href="tem:0123456789" permet d'ouvrir une application d'appel pour téléphoner au destinataire désigné -->
            <a href="tel:0606060606" aria-label="Nous téléphoner"><i class="fa-solid fa-mobile-vibrate"></i></a>
            <!-- href="document hébergé" ouvre le document (target blank permet de l'pouvrir dans un nouvel onglet, download de le faire télécharger automatiquement) -->
            <!-- l'attribut download suffit ppour déclencher le dl, mais rajouter un nom (download="nom.ext") renomme le fichier une fois téléchargé -->
            <a href="../assets/pdf/mentions_légales.pdf" aria-label="Télécharger les mentions légales" target="_blank" download>Mentions légales</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
