    <main>
        <div class="container">
            <div class="row">
                <div class="col-6">
                    <div id="carouselExampleDark" class="carousel carousel-overlay slide" data-bs-theme="dark">
                        <div class="carousel-inner">
                            <div class="carousel-item active" data-bs-interval="10000">
                                <img src="../assets/images/barette_ram.jpg" class="d-block w-100 rounded-5" alt="Barrette de RAM 8GO">
                            </div>
                            <div class="carousel-item" data-bs-interval="2000">
                                <img src="../assets/images/laptop_gamer.webp" class="d-block w-100 rounded-5" alt="Laptop gamer">
                            </div>
                            <div class="carousel-item">
                                <img src="../assets/images/tour_gamer.webp" class="d-block w-100 rounded-5" alt="Tour gamer">
                            </div>
                        </div>
                        <div class="carousel-overlay-controls">
                            <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button"
                                data-bs-target="#carouselExampleDark" data-bs-slide="prev">
                                <span class="carousel-icon-prev" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>
                            <div class="carousel-indicators">
                                <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0"
                                    class="active" aria-current="true" aria-label="Slide 1"></button>
                                <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1"
                                    aria-label="Slide 2"></button>
                                <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="2"
                                    aria-label="Slide 3"></button>
                            </div>
                            <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button"
                                data-bs-target="#carouselExampleDark" data-bs-slide="next">
                                <span class="carousel-icon-next" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-6">
                    <div class="affichage_produit_carousel">
                        <h2>Nom du produit</h2>
                        <p>Description du produit</p>
                        <p>Prix du produit</p>
                        <button type="button">Acheter</button>
                    </div>
                </div>

                    class="fa-solid fa-envelope"></i></a>

            <a href="tel:0606060606" aria-label="Nous téléphoner"><i class="fa-solid fa-mobile-vibrate"></i></a>
